name: test
on:
  push:
    branches:
      - main
  pull_request:
env:
  # HACK Ignore Pen's Rust toolchain files, which make parallel FFI builds race on installing targets.
  RUSTUP_TOOLCHAIN: stable
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: swatinem/rust-cache@v2.9.2
      - uses: homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # main
      - run: brew trust pen-lang/pen
      - run: brew install pen-lang/pen/pen
      - run: pen build
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # main
      - run: brew trust pen-lang/pen
      - run: brew install pen-lang/pen/pen
      - run: pen test
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # main
      - run: brew trust pen-lang/pen
      - run: brew install pen-lang/pen/pen
      - run: pen format --check
  spell_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: streetsidesoftware/cspell-action@v9.1.0
        with:
          files: "**/*.{md,pen,sh}"
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npx markdown-link-check README.md
